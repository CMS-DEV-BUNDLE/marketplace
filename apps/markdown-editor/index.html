<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Editor</title>
  <script src="marked.js"></script>
  <script src="purify.min.js"></script>
  <style>
    :root {
      --bg: #F6F7F5;
      --surface: #FFFFFF;
      --surface-2: #EEF0ED;
      --ink: #1B1F1D;
      --muted: #5E6861;
      --line: #DFE3DF;
      --accent: #0F6E66;
      --accent-ink: #FFFFFF;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    :root[data-theme="dark"] {
      --bg: #121413;
      --surface: #1A1D1B;
      --surface-2: #222623;
      --ink: #E6E9E6;
      --muted: #8B948D;
      --line: #2A2F2C;
      --accent: #4FB8AD;
      --accent-ink: #0B1412;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
    }

    /* Top Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
      gap: 10px;
      z-index: 10;
    }

    .toolbar-left, .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stats-badge {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--muted);
      background: var(--surface-2);
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--line);
    }

    .btn-group {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: var(--surface-2);
    }

    .btn-group button {
      border: none;
      background: transparent;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .btn-group button:not(:last-child) {
      border-right: 1px solid var(--line);
    }

    .btn-group button.active {
      background: var(--surface);
      color: var(--ink);
      font-weight: 500;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 500;
      color: var(--ink);
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn:hover {
      background: var(--surface);
      border-color: var(--muted);
    }

    .btn-accent {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }

    .btn-accent:hover {
      opacity: 0.92;
      background: var(--accent);
    }

    /* Workspace / Panes */
    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 0;
      overflow: hidden;
    }

    .workspace.view-edit {
      grid-template-columns: 1fr;
    }

    .workspace.view-edit #preview-pane {
      display: none;
    }

    .workspace.view-preview {
      grid-template-columns: 1fr;
    }

    .workspace.view-preview #editor-pane {
      display: none;
    }

    .pane {
      height: 100%;
      overflow-y: auto;
      position: relative;
    }

    #editor-pane {
      display: flex;
      border-right: 1px solid var(--line);
      background: var(--surface);
    }

    .workspace.view-edit #editor-pane {
      border-right: none;
    }

    #editor {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      resize: none;
      padding: 16px 20px;
      background: var(--surface);
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 13.5px;
      line-height: 1.6;
      tab-size: 2;
    }

    #editor::placeholder {
      color: var(--muted);
      opacity: 0.7;
    }

    #preview-pane {
      background: var(--bg);
      padding: 20px 28px;
    }

    /* Rich Markdown Styles */
    .markdown-body {
      font-size: 14.5px;
      line-height: 1.65;
      color: var(--ink);
      max-width: 860px;
      margin: 0 auto;
    }

    .markdown-body > *:first-child {
      margin-top: 0 !important;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4 {
      color: var(--ink);
      font-weight: 600;
      margin-top: 24px;
      margin-bottom: 12px;
      line-height: 1.25;
    }

    .markdown-body h1 {
      font-size: 1.8em;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }

    .markdown-body h2 {
      font-size: 1.4em;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line);
    }

    .markdown-body h3 {
      font-size: 1.2em;
    }

    .markdown-body p,
    .markdown-body ul,
    .markdown-body ol,
    .markdown-body blockquote,
    .markdown-body table,
    .markdown-body pre {
      margin-bottom: 16px;
    }

    .markdown-body ul,
    .markdown-body ol {
      padding-left: 24px;
    }

    .markdown-body li {
      margin-top: 4px;
    }

    .markdown-body li > p {
      margin-bottom: 4px;
    }

    .markdown-body a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .markdown-body blockquote {
      border-left: 4px solid var(--accent);
      padding: 6px 16px;
      background: var(--surface);
      color: var(--muted);
      border-radius: 0 6px 6px 0;
    }

    .markdown-body code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: var(--surface-2);
      border: 1px solid var(--line);
      padding: 2px 5px;
      border-radius: 4px;
      color: var(--ink);
    }

    .markdown-body pre {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 14px;
      overflow-x: auto;
    }

    .markdown-body pre code {
      background: transparent;
      border: none;
      padding: 0;
      font-size: 13px;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .markdown-body th,
    .markdown-body td {
      border: 1px solid var(--line);
      padding: 8px 12px;
      text-align: left;
    }

    .markdown-body th {
      background: var(--surface-2);
      font-weight: 600;
    }

    .markdown-body tr:nth-child(even) {
      background: var(--surface);
    }

    .markdown-body hr {
      border: none;
      border-top: 1px solid var(--line);
      margin: 24px 0;
    }

    .empty-preview {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: var(--muted);
      font-style: italic;
      font-size: 13px;
    }

    @media (max-width: 860px) {
      .toolbar {
        padding: 6px 12px;
      }
      .workspace:not(.view-edit):not(.view-preview) {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
      #editor-pane {
        border-right: none;
        border-bottom: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="toolbar">
      <div class="toolbar-left">
        <span class="app-title">📝 Markdown Editor</span>
        <span id="stats" class="stats-badge">0 words · 0 chars</span>
      </div>
      <div class="toolbar-right">
        <div class="btn-group" role="group" aria-label="View Mode">
          <button id="btn-view-split" class="active" title="Split view">Split</button>
          <button id="btn-view-edit" title="Editor only">Edit</button>
          <button id="btn-view-preview" title="Preview only">Preview</button>
        </div>
        <button id="btn-copy-md" class="btn" title="Copy markdown raw source">Copy MD</button>
        <button id="btn-copy-html" class="btn" title="Copy rendered HTML">Copy HTML</button>
        <button id="btn-clear" class="btn" title="Clear editor content">Clear</button>
      </div>
    </header>
    <main id="workspace" class="workspace">
      <div id="editor-pane" class="pane">
        <textarea id="editor" placeholder="# Welcome to Markdown Editor&#10;&#10;Start typing Markdown on the left, and view the formatted output live on the right..." spellcheck="false"></textarea>
      </div>
      <div id="preview-pane" class="pane">
        <div id="preview" class="markdown-body"></div>
      </div>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
